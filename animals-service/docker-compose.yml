version: '3.8'
services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Perlita1610
      POSTGRES_DB: huellitas_callejeras
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d huellitas_callejeras"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:Perlita1610@db:5432/huellitas_callejeras?schema=public
      PORT: 3001
      JWT_SECRET: mi-super-secreto-jwt-cambiar-en-produccion-12345
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./uploads:/usr/src/app/uploads
    ports:
      - "3001:3001"
    restart: unless-stopped

volumes:
  db-data: